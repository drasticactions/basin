id = "win8-full-en-us"
name = "Windows 8 full"
language = "en"
width_units = 15
grid_rows = 6
grid_columns = 16
row_heights = [50, 60, 60, 60, 60, 60]

rows = [
    [
        { w = 1, plain = "{escape}" },
        { w = 0.5, spacer = true },
        { w = 1.25, plain = "{home}" },
        { w = 1.25, plain = "{end}" },
        { w = 1.25, plain = "{page-up}" },
        { w = 1.25, plain = "{page-down}" },
        { w = 6.75, spacer = true },
        { w = 1.75, plain = "{delete}" },
    ],
    [
        { w = 1, plain = "`", alt = "~", class = "number" },
        { w = 1, plain = "1", alt = "!", class = "number" },
        { w = 1, plain = "2", alt = "@", class = "number" },
        { w = 1, plain = "3", alt = "#", class = "number" },
        { w = 1, plain = "4", alt = "$", class = "number" },
        { w = 1, plain = "5", alt = "%", class = "number" },
        { w = 1, plain = "6", alt = "^", class = "number" },
        { w = 1, plain = "7", alt = "&", class = "number" },
        { w = 1, plain = "8", alt = "*", class = "number" },
        { w = 1, plain = "9", alt = "(", class = "number" },
        { w = 1, plain = "0", alt = ")", class = "number" },
        { w = 1, plain = "-", alt = "_", long = ["-", "_", "–", "—", "±"], class = "number" },
        { w = 1, plain = "=", alt = "+", class = "number" },
        { w = 2, plain = "{backspace}" },
    ],
    [
        { w = 1.5, plain = "{tab}" },
        { w = 1, plain = "q" },
        { w = 1, plain = "w" },
        { w = 1, plain = "e", long = ["e", "è", "é", "ê", "ë", "ę", "ē"] },
        { w = 1, plain = "r", long = ["r", "®"] },
        { w = 1, plain = "t", long = ["t", "™", "þ"] },
        { w = 1, plain = "y", long = ["y", "ý", "ÿ"] },
        { w = 1, plain = "u", long = ["u", "ù", "ú", "û", "ü", "ű"] },
        { w = 1, plain = "i", long = ["i", "ì", "í", "î", "ï", "İ", "ı"] },
        { w = 1, plain = "o", long = ["o", "ò", "ó", "ô", "õ", "ö", "ø", "ő", "œ", "º"] },
        { w = 1, plain = "p", long = ["p", "§", "π"] },
        { w = 1, plain = "[", alt = "{" },
        { w = 1, plain = "]", alt = "}" },
        { w = 1.5, plain = "\\", alt = "|" },
    ],
    [
        { w = 1.75, plain = "{caps}" },
        { w = 1, plain = "a", long = ["a", "à", "á", "â", "ã", "ä", "å", "æ", "ª"] },
        { w = 1, plain = "s", long = ["s", "š", "ş", "ß"] },
        { w = 1, plain = "d", long = ["d", "ð"] },
        { w = 1, plain = "f" },
        { w = 1, plain = "g", long = ["g", "ğ"] },
        { w = 1, plain = "h" },
        { w = 1, plain = "j" },
        { w = 1, plain = "k" },
        { w = 1, plain = "l", long = ["l", "ł"] },
        { w = 1, plain = ";", alt = ":" },
        { w = 1, plain = "'", alt = "\"", long = ["'", "\"", "`", "‘", "’", "“", "”", "«", "»"] },
        { w = 2.25, plain = "{return}" },
    ],
    [
        { w = 2.25, plain = "{shift}" },
        { w = 1, plain = "z", long = ["z", "ž", "ź", "ż"] },
        { w = 1, plain = "x" },
        { w = 1, plain = "c", long = ["c", "ç", "ć", "©"] },
        { w = 1, plain = "v" },
        { w = 1, plain = "b" },
        { w = 1, plain = "n", long = ["n", "ñ", "ń"] },
        { w = 1, plain = "m", long = ["m", "µ"] },
        { w = 1, plain = ",", alt = "<" },
        { w = 1, plain = ".", alt = ">", long = [".", "…", "•"] },
        { w = 1, plain = "/", alt = "?" },
        { w = 1, plain = "{up}" },
        { w = 1.75, plain = "{shift}" },
    ],
    [
        { w = 1, plain = "{page:fn}", label = "Fn" },
        { w = 1.25, plain = "{control}" },
        { w = 1.25, plain = "{super}" },
        { w = 1.25, plain = "{alt}" },
        { w = 5.25, plain = " " },
        { w = 1, plain = "{emoji}" },
        { w = 1, plain = "{left}" },
        { w = 1, plain = "{down}" },
        { w = 1, plain = "{right}" },
        { w = 1, plain = "{hide}", long = ["{hide}", "{shape:standard}", "{shape:thumb}", "{shape:full}"] },
    ],
]

