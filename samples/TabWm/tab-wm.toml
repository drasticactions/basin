# tab-wm configuration. Each tab of the strip holds a workspace.
# Delete a key to go back to its default.

[theme]
# auto uses the native KDE Union engine when it loads, else the managed one.
engine = "auto"          # auto | native | managed
variant = "auto"         # auto | light | dark; light and dark pick a Breeze scheme
color-scheme = ""        # a KColorScheme name; empty follows the session or the variant

[shell]
xwayland = true

[tabs]
# Close a tab when its last window closes, instead of showing the launcher.
close-when-empty = false
# How long a polite close waits for windows before it shows the ones that stay.
close-timeout-ms = 5000

[launcher]
pinned = ["org.kde.konsole.desktop", "foot.desktop", "firefox.desktop"]
terminal = ""            # empty uses $TERMINAL, then the environment rules

[session]
# Reopen the tabs and apps of the last session at start.
restore = true
# The session lock client that Super+Escape and the menu run. Empty disables locking.
lock-command = "swaylock -f"

[accessibility]
# auto serves the screen reader under DRM and stays off when nested or headless.
enabled = "auto"         # auto | on | off
# toggle starts and stops the reader on Super+Alt+S. on starts it with the session.
screen-reader = "toggle" # off | toggle | on
screen-reader-command = ["orca", "--replace"]
# High-contrast chrome. Applications also get the contrast preference through the Settings portal.
high-contrast = false
# Turns animations off. Applications also get the reduced-motion preference through the Settings portal.
reduced-motion = false

# Keyboard aids for physical keys. Every aid is off by default.
# [accessibility.keyboard]
# sticky = false           # a modifier tapped alone stays down for the next key, a second tap locks it
# sticky-shortcut = false  # five taps of Shift turn sticky keys on and off
# slow-ms = 0              # a key counts only after it stays down this long
# bounce-ms = 0            # a new press of a key this soon after its release is ignored
# mouse-keys = false       # the keypad moves the pointer, 5 clicks, / * - choose the button
# mouse-keys-speed = 1000  # the highest pointer speed in logical pixels per second

[keys]
# Every default chord can be rebound or removed. Examples:
# "Super+T" = "new-tab"
# "Super+Return" = ["foot"]
# "Super+Q" = false

# [[startup]]
# command = "foot"       # runs once into the first tab of the primary output
