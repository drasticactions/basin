[compositor]
renderer      = "vulkan"     # --renderer
outputs       = 1            # --outputs
scale         = []           # --scale, one entry per output; empty asks the outputs

# Per-output settings, by connector name. A key that is absent stays automatic,
# and the [compositor] scale array above beats a matching section here.
# [output."DP-1"]
# scale     = 1.5
# transform = "normal"        # normal | 90 | 180 | 270 | flipped | flipped-90 | flipped-180 | flipped-270
# mode      = "3840x2560@60"  # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ

[frame]
style         = "flat"       # beos | flat | metacity | quill | none
corner_radius = 0            # logical pixels
font_size     = 14           # title size in logical pixels, every style; SIGHUP redraws every frame

# A metacity theme, read from ~/.themes, $XDG_DATA_HOME/themes and $XDG_DATA_DIRS/themes.
# [frame.metacity]
# theme         = "Menta"                        # a directory under themes/
# button_layout = "menu:minimize,maximize,close" # marco's grammar, spacer allowed
# palette       = "light"                        # light | dark
# backdrop_blur = 0                              # blur strength, 1 to 15; 0 turns the frost off

# The Prowl.Quill frames. They run on every GPU renderer. vulkan, skia-vulkan and
# skia-graphite draw them on the renderer's own VulkanDevice, with no GL. gl and
# skia-gl share their GlDevice, and impeller gets a GlDevice of its own on the same
# render node. pixman and skia cannot import the chrome buffer, so those runs log
# the reason and fall back to the flat frames.
# [frame.quill]
# palette       = "dark"     # dark | light
# corner_radius = 8          # logical pixels, 0 for square corners
# font_size     = 13         # title size in logical pixels
# backdrop_blur = 0          # blur strength, 1 to 15; 0 turns the frost off. It is not a pixel
#                            # radius
# frost_opacity = 0.44       # how much titlebar color sits over the blur, 0 to 1.
#                            # 0 is clear glass, 1 hides the blur entirely

[color]
source      = "edid"         # edid | srgb | icc
icc         = ""             # profile path when source = "icc"
hdr         = false          # drive the outputs in HDR where they support it
night_light = 0              # kelvin; 0 is off

[effects]
# Window animations.
wobbly   = false             # wobble windows on interactive move
open     = "none"            # none | fade | zoom | glide | sheet
close    = "none"            # none | fade | zoom | fire | fire-gpu | glide | sheet | fall-apart
minimize = "none"            # none | magic-lamp | squash
switcher = false             # flip through windows as 3d cards
stretch  = false             # stretch the last frame while a window resizes
slide_back = false           # push the other windows back when one is raised
notifications = false        # slide a layer-shell notification in on a spring

# Window appearance.
dim_inactive = false         # dim every window but the focused one
drop_shadow  = false         # a soft shadow under every window
highlight    = false         # ghost the unselected cards while the switcher is up

# Screen-wide post stages, in the order they are listed. A single name or an
# array: post = ["show-paint", "color-blindness"]
post = "none"                # none | invert | magnify | zoom | color-blindness | show-paint
color_blindness = "protanopia"   # protanopia | deuteranopia | tritanopia | monochrome
color_blindness_intensity = 1.0  # 0 is off, 1 is the full simulation
zoom_tracking = "proportional"   # proportional | centered | push | disabled | centered-strict
blend_changes = false        # crossfade the screen when a reload changes it
screen_transform = false     # crossfade a rotation instead of cutting to it

# A libraslang/RetroArch slang preset. This is used on all outputs.
# Needs the vulkan or gl renderer and the librashader library. "none" is off.
shader = "none"              # a .slangp path, or none
shader_continuous = true    # repaint every vblank for an animated preset

# Preset parameters by name. librashader reports the names and the ranges,
# Posting a name without a preset shows a warning.
# [effects.shader_params]
# CRTgamma = 2.4

# You can also change presets together.
# [[effects.shader]]
# path = "~/shaders/ntsc/ntsc-adaptive.slangp"
# [[effects.shader]]
# path = "~/shaders/crt/crt-geom.slangp"
#   [effects.shader.params]
#   CRTgamma = 2.4

# Input and session feedback.
shake_cursor = false         # grow the cursor when it is shaken
mouse_click  = false         # draw a ring where each button lands
mouse_mark   = false         # draw on the screen with Alt and the middle button
track_mouse  = false         # turning rings around the cursor while a button is held
touch_points = false         # draw a ring for every touch contact
system_bell  = false         # flash the focused window when a client asks for attention
startup_feedback = "none"    # none | bouncing | blinking | passive

# A canvas wider than the screen. The center maps to the screen 1:1, and the
# canvas past each outer edge compresses into a side zone along a smooth curve,
# so a window pushed past the seam bends across it and parks as a strip at the
# edge, still visible and still clickable. Every key is live on SIGHUP, and the
# same keys under an [output."NAME"] table override them for one output.
[canvas]
enable       = false         # wider canvas with compressed side zones
zone         = 0.12          # fraction of the output width each zone takes on screen
extension    = 0.5           # how far the canvas extends past each seam, as a fraction of the output width
edge_scale   = 0.2           # draw scale at the far edge; must stay below zone / extension
slope        = 0.25          # how far the rows fan from the center row at the far edge; 0 keeps them flat, negative fans inward
mesh_cell    = 16            # canvas pixels per mesh column inside a zone
grid         = "always"      # always | drag | never
grid_cell    = 64            # canvas pixels between grid lines
grid_color   = "#2a35c0"     # the grid line color
animation_ms = 250           # park, recall and toggle

# The hyprland-protocols pack: hyprland_surface, focus grab, lock notify,
# toplevel mapping and export, CTM control, global shortcuts and input capture.
# Each flag needs a restart to change.
[hypr]
enable        = true         # advertise the pack at all
input_capture = true         # hyprland_input_capture_v1, which needs libeis
ctm           = true         # hyprland_ctm_control_v1; KMS on drm, a post stage elsewhere

# A global shortcut a client registers, over hyprland_global_shortcuts_v1 or the
# GlobalShortcuts portal, fires on the chord bound here. Rows are
# "app_id:id" = "Mod+Mod+Key". A portal client that asks for a preferred trigger
# gets it when it parses and collides with nothing here or in [bindings]; a
# registration with no row and no accepted preference goes to the bind prompt
# through the portal and never fires through the hyprland protocol.
# [shortcuts]
# "org.example.app:toggle" = "Super+Shift+P"

# The chord is Mod+Mod+Key, where the key is an xkb keysym name.
[bindings]
"Alt+Escape"      = "quit"
"Alt+Tab"         = "cycle"
"Alt+s"           = "cycle-scale"
"Alt+Left"        = "workspace-prev"
"Alt+Right"       = "workspace-next"
"Alt+Shift+Left"  = "carry-prev"
"Alt+Shift+Right" = "carry-next"
"Alt+n"           = "workspace-new"
"Alt+Return"    = { exec = "foot" }
# The canvas actions, unbound by default:
# "Alt+Shift+h"   = "park-left"
# "Alt+Shift+l"   = "park-right"
# "Alt+Shift+j"   = "recall"
# "Alt+Shift+c"   = "canvas-toggle"

# Per Window/App rules
# [[rule]]
# app_id      = "mpv"        # exact match
# title_regex = ""           # optional
# frame       = "none"         # beos | flat | metacity | none
# effects     = false        # or per effect: wobbly = false, open = "none"
# workspace   = 2
# x = 0
# y = 0
# width  = 1280
# height = 720
# canvas = "left"            # left | right: park the window in a canvas zone at map
