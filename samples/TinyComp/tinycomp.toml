[compositor]
renderer      = "vulkan"     # --renderer
outputs       = 1            # --outputs
scale         = []           # --scale, one entry per output
background    = "#171a1f"    # desktop color, #rrggbb

# Output pacing for every output.
[output]
vrr_pacing    = "fullscreen" # fullscreen | always | never: when a VRR output repaints on arrival
allow_tearing = true         # honor a fullscreen window's tearing hint

# Per-output settings, by connector name.
# [output."DP-1"]
# scale     = 1.5
# transform = "normal"        # normal | 90 | 180 | 270 | flipped | flipped-90 | flipped-180 | flipped-270
# mode      = "3840x2560@60"  # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ

[frame]
style         = "flat"       # beos | flat | metacity | msstyles | quill | glass | none
corner_radius = 0            # logical pixels
font_size     = 14           # title size in logical pixels

# Metacity theme frames.
# [frame.metacity]
# theme         = "Menta"                        # a directory under themes/
# button_layout = "menu:minimize,maximize,close" # marco's button layout
# palette       = "light"                        # light | dark
# backdrop_blur = 0                              # 0 off, 1 to 15

# Windows visual style frames.
# [frame.msstyles]
# theme         = "Luna"       # a name under themes/ or msstyles/, or a path
# color         = ""           # color scheme, empty for the theme's first
# size          = ""           # size variant, empty for the theme's first
# look          = "auto"       # auto | classic-xp | basic | glass
# font          = ""           # caption font when the theme's is missing
# colorization  = "#45409efe"  # glass tint, #aarrggbb, alpha is the strength
# backdrop_blur = 0            # 0 off, any other value blurs behind glass
# painter       = "skia"       # skia | quill

# Prowl.Quill frames.
# [frame.quill]
# palette       = "dark"     # dark | light
# corner_radius = 8          # logical pixels
# font_size     = 13         # title size in logical pixels
# backdrop_blur = 0          # 0 off, 1 to 15
# frost_opacity = 0.44       # titlebar tint over the blur, 0 to 1

# Fully composited glass frames, drawn by Quill and the glass backdrop effect.
# [frame.glass]
# palette       = "dark"       # dark | light
# corner_radius = 12           # logical pixels
# font_size     = 13           # title size in logical pixels
# blur          = 8            # 1 to 15
# blur_kernel   = "kawase"     # kawase | vista | smol
# pass          = "composite"  # composite | fused
# tint          = "#60202832"  # #aarrggbb, alpha is the strength; the palette chooses when unset
# saturation    = 1.4
# noise         = 0.03
# refraction    = 0.6          # lens strength, 0 off
# bevel         = 10           # logical pixels of the lens band
# specular      = 0.5          # fixed-light sheen, 0 off
# light_angle   = 315          # degrees, 0 is from the right
# glint         = 0.6          # pointer glint, 0 off
# glint_radius  = 80           # logical pixels
# client_glass  = true         # glass behind translucent client pixels
# shadow        = true
# glow          = "#5070a0ff"  # active glow, #aarrggbb, alpha 0 off
# animation_ms  = 150
# inset         = 6            # logical pixels of glass around the content
# content_radius = -1          # content corners; -1 follows corner_radius - inset
# content_border = "#38ffffff" # line around the content, #aarrggbb, alpha 0 off
# content_border_width = 1     # logical pixels

[color]
source      = "edid"         # edid | srgb | icc
icc         = ""             # profile path for source = "icc"
hdr         = false          # HDR output
night_light = 0              # kelvin, 0 off
inverse_tone_mapping = false # expand SDR windows on an HDR output (BT.2446a)
itm_sdr_nits    = 100        # the SDR level that expansion starts from
itm_target_nits = 1000       # the HDR level that expansion reaches
look        = "none"         # a .cube LUT applied to the output, or none
hdr_demand  = false          # drive HDR only while an HDR window shows

[effects]
# Window animations.
wobbly   = false             # wobble windows on interactive move
open     = "none"            # none | fade | zoom | glide | sheet
close    = "none"            # none | fade | zoom | fire | fire-gpu | glide | sheet | fall-apart
minimize = "none"            # none | magic-lamp | squash
switcher = false             # 3D card window switcher
stretch  = false             # stretch during resize
slide_back = false           # push other windows back on raise
notifications = false        # slide in notifications

# Window appearance.
dim_inactive = false         # dim unfocused windows
dim_strength = 25            # dim strength in percent, 10 to 90
dim_panels = false           # dim inactive panels and docks
dim_desktop = false          # dim the desktop window
dim_keep_above = false       # dim inactive windows that stay above the others
dim_by_group = true          # keep a window's dialogs bright with it, and dim them together
dim_full_screen = true       # dim inactive full-screen windows
drop_shadow  = false         # window shadows
highlight    = false         # ghost unselected switcher cards
blur_kernel  = "kawase"      # client background blur: kawase | vista (Aero glass, no strength) | smol (Gaussian)

# Screen post stages, a name or an array.
post = "none"                # none | invert | magnify | zoom | color-blindness | show-paint
color_blindness = "protanopia"   # protanopia | deuteranopia | tritanopia | monochrome
color_blindness_intensity = 1.0  # 0 to 1
zoom_tracking = "proportional"   # proportional | centered | push | disabled | centered-strict
blend_changes = false        # crossfade on reload
screen_transform = false     # crossfade on rotation

# RetroArch slang shader.
shader = "none"              # a .slangp path, or none
shader_continuous = false    # repaint every vblank

# Shader parameters by name.
# [effects.shader_params]
# CRTgamma = 2.4

# Shader chain, each preset with its own parameters.
# [[effects.shader]]
# path = "~/shaders/ntsc/ntsc-adaptive.slangp"
# [[effects.shader]]
# path = "~/shaders/crt/crt-geom.slangp"
#   [effects.shader.params]
#   CRTgamma = 2.4

# Input and session feedback.
shake_cursor = false         # grow a shaken cursor
mouse_click  = false         # ring at each click
mouse_mark   = false         # draw with Alt and the middle button
track_mouse  = false         # rings around the cursor while a button is held
touch_points = false         # ring at each touch
system_bell  = false         # flash on attention requests
startup_feedback = "none"    # none | bouncing | blinking | passive
rotate_step  = 15            # rotate-left and rotate-right, in degrees
rotate_release = "exact"     # two-finger twist release: exact | spin

# Canvas with compressed edge zones. [output."NAME"] takes the same keys.
[canvas]
enable       = false         # canvas on or off
sides        = ["left", "right"]  # left | right | top | bottom
corner       = "round"       # round | square | taper
# corner_radius = 1.0        # 0.0 square to 1.0 round
# zone       = 0.12          # zone width, fraction of the output
extension    = 0.5           # canvas past each seam, fraction of the output
edge_scale   = 0.2           # draw scale at the far edge
slope        = 0.25          # row fan at the far edge
mesh_cell    = 16            # canvas pixels per mesh cell
grid         = "always"      # always | drag | never
grid_cell    = 64            # canvas pixels between grid lines
grid_color   = "#2a35c0"     # grid line color
grid_animation    = "fade"      # drag grid: none | fade | ripple | draw | sweep
grid_animation_ms = 200         # drag grid: show and hide duration
grid_easing       = "out-cubic" # drag grid: linear | out-cubic | in-out-cubic | ... or [x1, y1, x2, y2]
grid_linger_ms    = 150         # drag grid: hold after the drop
desktop_grid = false         # terrace: grid on the desktop
wallpaper    = "desktop"     # desktop | output
animation_ms = 250           # park, recall and toggle
window       = "warp"        # warp | scale | terrace
min_scale    = 0.35          # scale: smallest window scale
scale_reach  = 1.0           # scale: shrink depth
shelf        = 0.10          # terrace: shelf width, fraction of the output
shelf_scale  = 0.4           # terrace: shelf scale, or { left = 0.4, right = 0.3 }
shelf_min_scale = 0.2        # terrace: smallest shelved window scale
shelf_step   = 0.05          # terrace: shelf-smaller and shelf-larger step
shelf_shape  = "square"      # terrace: square | flat
slope_window = "bend"        # terrace: bend | flat
drag         = "cursor"      # scale and terrace: cursor | grid

# Grid effects on the canvas grid. [output."NAME".grid_effects] takes the same keys.
[canvas.grid_effects]
glow              = 0.0        # line glow strength, 0 to 1
glow_radius       = 6.0        # glow width in screen pixels
glow_path         = "auto"     # auto | shader | halo | none
highlight_color   = "#e8ecff"  # color that lit lines move toward
highlight_radius  = 160.0      # highlight reach in screen pixels
highlight_glow    = 2.0        # extra glow near a lit source, 0 to 8
highlight_dragged = 0.0        # the moved or thrown window, 0 to 1
highlight_focused = 0.0        # the focused window, 0 to 1
highlight_windows = 0.0        # every other window, 0 to 1
highlight_pointer = 0.0        # the pointer over the backdrop, 0 to 1
highlight_spring  = 300.0      # highlight spring constant
highlight_damping = 1.0        # highlight damping ratio
density           = false      # dim lines where the warp packs them
density_spacing   = 12.0       # full alpha at this screen spacing
density_floor     = 0.15       # lowest alpha of a packed line
pinch             = 0.0        # extra fan slope toward a fast window
pinch_reach       = 400.0      # distance from a seam where the pinch ends
pinch_speed       = 600.0      # body speed in px/s that pinches
pinch_spring      = 200.0      # pinch spring constant
pinch_damping     = 1.1        # pinch damping ratio
# The CurvedWindows look: set these keys, or send grid-effects curved.
# glow = 0.45
# highlight_dragged = 1.0
# highlight_focused = 0.4
# highlight_windows = 0.15
# highlight_pointer = 0.3
# density = true
# pinch = -0.8

# Overview. [output."NAME".overview] takes the same keys.
[overview]
enable        = true         # overview on or off
scale         = 0.75         # desktop zoom, 0.3 to 0.95
threshold_in  = 0.667        # shelve threshold on the slope
threshold_out = 0.333        # unshelve threshold on the slope
gesture       = true         # vertical swipe
gesture_fingers = 4          # 4 | 5
hot_corner    = "top-left"   # top-left | top-right | bottom-left | bottom-right | none
hot_corner_ms = 150          # hot corner delay
wall          = "step"       # slope | step
anchor        = "fill"       # fill | center
wall_width    = 0.04         # step: wall width, fraction of the output
wall_color    = "#262a3a"    # step: wall color
wall_shade    = 0.25         # step: wall shading
wall_texture  = "none"       # step: none | stone | brick | wood | noise | an image path
shelf_texture = "none"       # step: none | stone | brick | wood | noise | an image path
texture_scale = 1.0          # step: canvas pixels per texel, 0.25 to 8
shelf_color   = "#3a3d44"    # step: shelf texture tint
texture_grid  = true         # step: grid lines over a texture
sides         = ["left", "right"]  # left | right | top | bottom
# corner        = "round"      # slope: round | square | taper
# corner_radius = 1.0        # slope: 0.0 square to 1.0 round
# slope         = 0.25         # slope: row fan at the far edge
# mesh_cell     = 16           # slope: canvas pixels per mesh cell
# shelf         = 0.10         # slope: shelf width, fraction of the output
shelf_scale   = 0.4          # shelf scale, or { left = 0.4, right = 0.3 }
shelf_min_scale = 0.2        # smallest shelved window scale
shelf_step    = 0.05         # shelf-smaller and shelf-larger step
# shelf_shape   = "square"     # slope: square | flat
# slope_window  = "bend"       # slope: bend | flat
drag          = "cursor"     # slope: cursor | grid
grid          = "always"     # always | drag | never
grid_cell     = 64           # canvas pixels between grid lines
grid_color    = "#2a35c0"    # grid line color
grid_animation    = "fade"      # drag grid: none | fade | ripple | draw | sweep
grid_animation_ms = 200         # drag grid: show and hide duration
grid_easing       = "out-cubic" # drag grid: linear | out-cubic | in-out-cubic | ... or [x1, y1, x2, y2]
grid_linger_ms    = 150         # drag grid: hold after the drop
desktop_grid  = false        # grid on the zoomed desktop
animation_ms  = 250          # open and close

# Grid effects on the overview grid. [output."NAME".overview.grid_effects] takes the same keys.
[overview.grid_effects]
glow              = 0.0        # line glow strength, 0 to 1
glow_radius       = 6.0        # glow width in screen pixels
glow_path         = "auto"     # auto | shader | halo | none
highlight_color   = "#e8ecff"  # color that lit lines move toward
highlight_radius  = 160.0      # highlight reach in screen pixels
highlight_glow    = 2.0        # extra glow near a lit source, 0 to 8
highlight_dragged = 0.0        # the moved or thrown window, 0 to 1
highlight_focused = 0.0        # the focused window, 0 to 1
highlight_windows = 0.0        # every other window, 0 to 1
highlight_pointer = 0.0        # the pointer over the backdrop, 0 to 1
highlight_spring  = 300.0      # highlight spring constant
highlight_damping = 1.0        # highlight damping ratio
density           = false      # dim lines where the warp packs them
density_spacing   = 12.0       # full alpha at this screen spacing
density_floor     = 0.15       # lowest alpha of a packed line
pinch             = 0.0        # extra fan slope toward a fast window
pinch_reach       = 400.0      # distance from a seam where the pinch ends
pinch_speed       = 600.0      # body speed in px/s that pinches
pinch_spring      = 200.0      # pinch spring constant
pinch_damping     = 1.1        # pinch damping ratio

# Windows as rigid bodies: throw, collide, fall.
[physics]
enable        = false        # physics on or off
engine        = "bepu"       # bepu | box2d
gravity       = 0            # pixels per second squared, down; negative is up
gravity_steps = [0, 2000]    # the gravity action cycles these
friction      = 0.3          # surface friction, 0 to 2
restitution   = 0.2          # bounce, 0 to 1
density       = 1.0          # mass per area
damping       = 2.0          # slowdown per second
throw_multiplier = 1.0       # release speed factor
max_throw_speed = 6000       # pixels per second
stop_speed    = 20           # pixels per second
impact_speed  = 600          # slowest impact that squashes or shakes
rotation      = true         # windows spin
upright       = true         # a tilted window turns back upright at rest
impacts       = ["squash"]   # squash | shake
# [physics.workspace.2]
# gravity     = 2000         # per-workspace gravity

[xwayland]
scale       = "auto"         # the X11 scale: "auto" follows the largest output scale, or a number of at least 1
dpi_buckets = []             # snap the published DPI to the nearest of these, e.g. [72, 96, 160, 240]
low_density = true           # a second Xwayland at scale 1 and 96 DPI for [[launch]] rules with x11 = "low-density"

[process]
subreaper = true             # adopt orphans of -c and end the tree at exit; --subreaper beats it

[cursor]
hide_after_ms = 0            # hide the cursor after this long with no pointer input, 0 is off
park_pointer  = false        # while hidden, the window under the cursor gets a pointer leave

[touch]
hide_cursor    = true        # hide the cursor while the touchscreen is used, show it on mouse input
titlebar_twist = true        # two fingers, one on the titlebar, turn the window
window_twist   = 3           # fingers turned anywhere on a window turn it: 3 to 5, 0 is off
hold_move      = true        # two fingers held still on a window, then slid, move it
hold_ms        = 300         # how long the fingers rest before a slide moves the window
hold_move_turn = true        # turning the held fingers also turns the window

# How a released workspace or overview swipe lands. projection rounds the point
# where the swipe would coast to rest. threshold needs half the travel or a fast flick.
[gestures]
swipe_release = "projection" # projection | threshold

[settings]
palette   = "dark"           # dark | light
font_size = 14               # logical pixels

# The Dear ImGui inspector overlay, toggled by the inspector binding.
[inspector]
enabled    = true            # false never builds it
open       = false           # open at start
output     = "focused"       # an output name, or focused
panels     = ["outputs"]     # open at start: outputs | windows | clients | scene | memory | effects | transform
font_size  = 15              # logical pixels
refresh_hz = 10              # how often the live panels redraw

# hyprland-protocols.
[hypr]
enable        = true         # the whole pack
input_capture = true         # hyprland_input_capture_v1
ctm           = true         # hyprland_ctm_control_v1

# Global shortcuts, "app_id:id" = "Mod+Mod+Key".
# [shortcuts]
# "org.example.app:toggle" = "Super+Shift+P"

# Input devices: [input] for every device, [input.<type>] per type
# (keyboard, pointer, touchpad, touch, tablet_tool, tablet_pad, switch),
# [[input.device]] per device.
[input.touchpad]
tap            = true           # tap to click
click_method   = "clickfinger"  # none | button_areas | clickfinger
# natural_scroll = false
# scroll_method  = "two_finger" # none | two_finger | edge | on_button_down
# dwt            = true         # disable while typing
# drag           = true         # tap and drag
# drag_lock      = "disabled"   # disabled | enabled | enabled_sticky
# tap_button_map = "lrm"        # lrm | lmr
# middle_emulation = false

# [input.pointer]
# accel_profile  = "adaptive"   # none | flat | adaptive | custom
# accel_speed    = 0.0          # -1 to 1
# scroll_factor  = 1.0
# natural_scroll = false
# left_handed    = false

# [input.keyboard]
# layout       = "us,de"
# variant      = ""
# model        = ""
# options      = "grp:alt_shift_toggle"
# rules        = ""
# repeat_rate  = 25             # per second
# repeat_delay = 400            # milliseconds

# [[input.device]]
# name          = "Logitech*"   # glob; or sysname, vendor, product, output
# accel_profile = "flat"
# map_to_output = "DP-2"

# Key bindings, Mod+Mod+Key with an xkb keysym name.
[bindings]
# A binding can be a table that says when it applies, which defaults to always:
# "Alt+Tab" = { action = "cycle", when = "windowed" }   # always | windowed | fullscreen
"Alt+Escape"      = "quit"
"Alt+Tab"         = "cycle"
"Alt+s"           = "cycle-scale"
"Alt+Left"        = "workspace-prev"
"Alt+Right"       = "workspace-next"
"Alt+Shift+Left"  = "carry-prev"
"Alt+Shift+Right" = "carry-next"
"Alt+n"           = "workspace-new"
"Super+comma"     = "settings"
"Super+F12"       = "inspector"
"Super+Alt+s"     = "screen-reader"
"Super+Alt+8"     = "magnifier"
"Super+Alt+equal" = "magnifier-in"
"Super+Alt+minus" = "magnifier-out"
"Super+Alt+c"     = "screen-curtain"
"Alt+Return"    = { exec = "foot" }
# Canvas actions.
# "Alt+Shift+h"   = "park-left"
# "Alt+Shift+l"   = "park-right"
# "Alt+Shift+k"   = "park-up"
# "Alt+Shift+m"   = "park-down"
# "Alt+Shift+j"   = "recall"
# "Alt+Shift+c"   = "canvas-toggle"
# "Alt+Shift+minus" = "shelf-smaller"
# "Alt+Shift+equal" = "shelf-larger"
# "Alt+Shift+0"   = "shelf-reset"
# "Alt+Shift+t"   = "canvas-mode"
# Overview actions.
# "Super+Tab"     = "overview"
# "Super+Left"    = "shelve-left"
# "Super+Right"   = "shelve-right"
# "Super+Up"      = "shelve-top"
# "Super+Down"    = "shelve-bottom"
# "Super+u"       = "unshelve"
# Physics actions.
# "Alt+Shift+g"   = "gravity"
# "Alt+Shift+f"   = "physics-freeze"
# Rotation actions.
# "Alt+Shift+comma"  = "rotate-left"
# "Alt+Shift+period" = "rotate-right"
# "Alt+Shift+u"   = "upright"
# "Alt+Shift+s"   = "stop-spin"

# Window rules.
# [[rule]]
# app_id      = "mpv"        # exact match
# title_regex = ""           # regex
# steam_game  = 570          # the game id from STEAM_GAME, SteamGameId or SteamAppId
# process     = "dota2"      # the process name or its executable, exact
# x11_class   = "Steam"      # the class half of WM_CLASS, X11 only
# x11_instance = "steamwebhelper"  # the instance half of WM_CLASS, X11 only
# window_type = "dialog"     # or a list: normal, dialog, utility, splash, ...
# wants_focus = false        # X11: a window that declines focus (input hint, WS_DISABLED, 1x1, no-activate)
# skip_taskbar = true        # X11: _NET_WM_STATE_SKIP_TASKBAR
# frame       = "none"       # beos | flat | metacity | msstyles | quill | none
# effects     = false        # or per effect: wobbly = false, open = "none"
# workspace   = 2
# x = 0
# y = 0
# width  = 1280
# height = 720
# canvas = "left"            # left | right | top | bottom | top-left | top-right | bottom-left | bottom-right
# physics    = false         # not a body
# pin        = true          # a body that does not move
# no_collide = true          # passes through other windows
# mass       = 2.0           # density
# gravity    = 0.5           # gravity scale
# bounce     = 0.8           # restitution
# letterbox  = "fit"         # fit | center | integer | fill | stretch | off: a fullscreen, maximized or tiled window that keeps another size
# scale_filter = "nearest"   # linear | nearest | pixel: how a scaled window is sampled; pixel is vulkan and gl only, nearest elsewhere
# readiness  = "immediate"   # matching | immediate: X11 only, whether a configure waits for a matching commit
# force_unmaximize = true    # X11 only: ignore a maximize request at map
# allow_client_move = true   # X11 only: honor the position in a ConfigureRequest after map
# emulated_modes = false     # X11 only: ignore a game's RandR mode emulation
# frame_limit = 60           # tell the window to draw at most this many times a second
# friction   = 0.1

# Launch rules choose the X server an X11 application starts on. A rule matches
# before the process exists. The most specific rule wins: desktop_id and exec
# together, then desktop_id, then exec. x11 = "low-density" starts it on the
# second Xwayland at scale 1 and 96 DPI ([xwayland] low_density), which suits
# GTK 2, Tk, Motif and programs that ignore the DPI. The scene stretches it.
# [[launch]]
# desktop_id = "leafpad.desktop"   # the desktop entry id
# exec       = "leafpad"           # the base name of the program, after env and NAME=value words
# x11        = "low-density"       # native | low-density

# What a DRM start inherits and a DRM exit leaves lit. docs/handoff.md has the rules.
[handoff]
mode = "auto"            # auto | retain | off. --handoff beats it. Read at start only
transition = "crossfade" # crossfade | cut: how the inherited frame gives way to this one
duration_ms = 400        # the crossfade
hold_limit_ms = 3000     # the longest the inherited frame stays before the transition starts

# Screen reader support. docs/accessibility.md has the rules.
[accessibility]
enabled = "auto"         # auto | on | off. auto is on under DRM, off nested or headless
# toggle starts and stops the reader on Super+Alt+s. on starts it with the session.
screen-reader = "toggle" # off | toggle | on
screen-reader-command = ["orca", "--replace"]
# High-contrast Quill frames. Applications also get the contrast preference through the Settings portal.
high-contrast = false
# Turns animations off. Applications also get the reduced-motion preference through the Settings portal.
reduced-motion = false

# Keyboard aids for physical keys. Every aid is off by default.
# [accessibility.keyboard]
# sticky = false           # a modifier tapped alone stays down for the next key, a second tap locks it
# sticky-shortcut = false  # five taps of Shift turn sticky keys on and off
# slow-ms = 0              # a key counts only after it stays down this long
# bounce-ms = 0            # a new press of a key this soon after its release is ignored
# mouse-keys = false       # the keypad moves the pointer, 5 clicks, / * - choose the button
# mouse-keys-speed = 1000  # the highest pointer speed in logical pixels per second
