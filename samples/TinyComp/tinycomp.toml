[compositor]
renderer      = "vulkan"     # --renderer
outputs       = 1            # --outputs
scale         = []           # --scale, one entry per output
background    = "#171a1f"    # desktop color, #rrggbb

# Per-output settings, by connector name.
# [output."DP-1"]
# scale     = 1.5
# transform = "normal"        # normal | 90 | 180 | 270 | flipped | flipped-90 | flipped-180 | flipped-270
# mode      = "3840x2560@60"  # WIDTHxHEIGHT or WIDTHxHEIGHT@HZ

[frame]
style         = "flat"       # beos | flat | metacity | quill | none
corner_radius = 0            # logical pixels
font_size     = 14           # title size in logical pixels

# Metacity theme frames.
# [frame.metacity]
# theme         = "Menta"                        # a directory under themes/
# button_layout = "menu:minimize,maximize,close" # marco's button layout
# palette       = "light"                        # light | dark
# backdrop_blur = 0                              # 0 off, 1 to 15

# Prowl.Quill frames.
# [frame.quill]
# palette       = "dark"     # dark | light
# corner_radius = 8          # logical pixels
# font_size     = 13         # title size in logical pixels
# backdrop_blur = 0          # 0 off, 1 to 15
# frost_opacity = 0.44       # titlebar tint over the blur, 0 to 1

[color]
source      = "edid"         # edid | srgb | icc
icc         = ""             # profile path for source = "icc"
hdr         = false          # HDR output
night_light = 0              # kelvin, 0 off

[effects]
# Window animations.
wobbly   = false             # wobble windows on interactive move
open     = "none"            # none | fade | zoom | glide | sheet
close    = "none"            # none | fade | zoom | fire | fire-gpu | glide | sheet | fall-apart
minimize = "none"            # none | magic-lamp | squash
switcher = false             # 3D card window switcher
stretch  = false             # stretch during resize
slide_back = false           # push other windows back on raise
notifications = false        # slide in notifications

# Window appearance.
dim_inactive = false         # dim unfocused windows
drop_shadow  = false         # window shadows
highlight    = false         # ghost unselected switcher cards

# Screen post stages, a name or an array.
post = "none"                # none | invert | magnify | zoom | color-blindness | show-paint
color_blindness = "protanopia"   # protanopia | deuteranopia | tritanopia | monochrome
color_blindness_intensity = 1.0  # 0 to 1
zoom_tracking = "proportional"   # proportional | centered | push | disabled | centered-strict
blend_changes = false        # crossfade on reload
screen_transform = false     # crossfade on rotation

# RetroArch slang shader.
shader = "none"              # a .slangp path, or none
shader_continuous = false    # repaint every vblank

# Shader parameters by name.
# [effects.shader_params]
# CRTgamma = 2.4

# Shader chain, each preset with its own parameters.
# [[effects.shader]]
# path = "~/shaders/ntsc/ntsc-adaptive.slangp"
# [[effects.shader]]
# path = "~/shaders/crt/crt-geom.slangp"
#   [effects.shader.params]
#   CRTgamma = 2.4

# Input and session feedback.
shake_cursor = false         # grow a shaken cursor
mouse_click  = false         # ring at each click
mouse_mark   = false         # draw with Alt and the middle button
track_mouse  = false         # rings around the cursor while a button is held
touch_points = false         # ring at each touch
system_bell  = false         # flash on attention requests
startup_feedback = "none"    # none | bouncing | blinking | passive

# Canvas with compressed edge zones. [output."NAME"] takes the same keys.
[canvas]
enable       = false         # canvas on or off
sides        = ["left", "right"]  # left | right | top | bottom
corner       = "round"       # round | square | taper
# corner_radius = 1.0        # 0.0 square to 1.0 round
# zone       = 0.12          # zone width, fraction of the output
extension    = 0.5           # canvas past each seam, fraction of the output
edge_scale   = 0.2           # draw scale at the far edge
slope        = 0.25          # row fan at the far edge
mesh_cell    = 16            # canvas pixels per mesh cell
grid         = "always"      # always | drag | never
grid_cell    = 64            # canvas pixels between grid lines
grid_color   = "#2a35c0"     # grid line color
desktop_grid = false         # terrace: grid on the desktop
wallpaper    = "desktop"     # desktop | output
animation_ms = 250           # park, recall and toggle
window       = "warp"        # warp | scale | terrace
min_scale    = 0.35          # scale: smallest window scale
scale_reach  = 1.0           # scale: shrink depth
shelf        = 0.10          # terrace: shelf width, fraction of the output
shelf_scale  = 0.4           # terrace: shelf scale, or { left = 0.4, right = 0.3 }
shelf_min_scale = 0.2        # terrace: smallest shelved window scale
shelf_step   = 0.05          # terrace: shelf-smaller and shelf-larger step
shelf_shape  = "square"      # terrace: square | flat
slope_window = "bend"        # terrace: bend | flat
drag         = "cursor"      # scale and terrace: cursor | grid

# Overview. [output."NAME".overview] takes the same keys.
[overview]
enable        = true         # overview on or off
scale         = 0.75         # desktop zoom, 0.3 to 0.95
threshold_in  = 0.667        # shelve threshold on the slope
threshold_out = 0.333        # unshelve threshold on the slope
gesture       = true         # vertical swipe
gesture_fingers = 4          # 4 | 5
hot_corner    = "top-left"   # top-left | top-right | bottom-left | bottom-right | none
hot_corner_ms = 150          # hot corner delay
wall          = "slope"      # slope | step
anchor        = "fill"       # fill | center
wall_width    = 0.04         # step: wall width, fraction of the output
wall_color    = "#262a3a"    # step: wall color
wall_shade    = 0.25         # step: wall shading
wall_texture  = "none"       # step: none | stone | brick | wood | noise | an image path
shelf_texture = "none"       # step: none | stone | brick | wood | noise | an image path
texture_scale = 1.0          # step: canvas pixels per texel, 0.25 to 8
shelf_color   = "#3a3d44"    # step: shelf texture tint
texture_grid  = true         # step: grid lines over a texture
sides         = ["left", "right"]  # left | right | top | bottom
corner        = "round"      # slope: round | square | taper
# corner_radius = 1.0        # slope: 0.0 square to 1.0 round
slope         = 0.25         # slope: row fan at the far edge
mesh_cell     = 16           # slope: canvas pixels per mesh cell
shelf         = 0.10         # slope: shelf width, fraction of the output
shelf_scale   = 0.4          # shelf scale, or { left = 0.4, right = 0.3 }
shelf_min_scale = 0.2        # smallest shelved window scale
shelf_step    = 0.05         # shelf-smaller and shelf-larger step
shelf_shape   = "square"     # slope: square | flat
slope_window  = "bend"       # slope: bend | flat
drag          = "cursor"     # slope: cursor | grid
grid          = "always"     # always | drag | never
grid_cell     = 64           # canvas pixels between grid lines
grid_color    = "#2a35c0"    # grid line color
desktop_grid  = false        # grid on the zoomed desktop
animation_ms  = 250          # open and close

[settings]
palette   = "dark"           # dark | light
font_size = 14               # logical pixels

# hyprland-protocols.
[hypr]
enable        = true         # the whole pack
input_capture = true         # hyprland_input_capture_v1
ctm           = true         # hyprland_ctm_control_v1

# Global shortcuts, "app_id:id" = "Mod+Mod+Key".
# [shortcuts]
# "org.example.app:toggle" = "Super+Shift+P"

# Key bindings, Mod+Mod+Key with an xkb keysym name.
[bindings]
"Alt+Escape"      = "quit"
"Alt+Tab"         = "cycle"
"Alt+s"           = "cycle-scale"
"Alt+Left"        = "workspace-prev"
"Alt+Right"       = "workspace-next"
"Alt+Shift+Left"  = "carry-prev"
"Alt+Shift+Right" = "carry-next"
"Alt+n"           = "workspace-new"
"Super+comma"     = "settings"
"Alt+Return"    = { exec = "foot" }
# Canvas actions.
# "Alt+Shift+h"   = "park-left"
# "Alt+Shift+l"   = "park-right"
# "Alt+Shift+k"   = "park-up"
# "Alt+Shift+m"   = "park-down"
# "Alt+Shift+j"   = "recall"
# "Alt+Shift+c"   = "canvas-toggle"
# "Alt+Shift+minus" = "shelf-smaller"
# "Alt+Shift+equal" = "shelf-larger"
# "Alt+Shift+0"   = "shelf-reset"
# "Alt+Shift+t"   = "canvas-mode"
# Overview actions.
# "Super+Tab"     = "overview"
# "Super+Left"    = "shelve-left"
# "Super+Right"   = "shelve-right"
# "Super+Up"      = "shelve-top"
# "Super+Down"    = "shelve-bottom"
# "Super+u"       = "unshelve"

# Window rules.
# [[rule]]
# app_id      = "mpv"        # exact match
# title_regex = ""           # regex
# frame       = "none"       # beos | flat | metacity | quill | none
# effects     = false        # or per effect: wobbly = false, open = "none"
# workspace   = 2
# x = 0
# y = 0
# width  = 1280
# height = 720
# canvas = "left"            # left | right | top | bottom | top-left | top-right | bottom-left | bottom-right
