theme      = "light"      # light | dark
background = ""           # background image path

# Backdrop blur behind the chrome.
[blur]
strength   = 5            # 1 to 15
taskbar    = false
start_menu = true
switcher   = true
titlebars  = false

# Input devices: [input] for every device, [input.<type>] per type
# (keyboard, pointer, touchpad, touch, tablet_tool, tablet_pad, switch),
# [[input.device]] per device.
# [input.touchpad]
# tap            = true
# natural_scroll = false
# click_method   = "clickfinger"  # none | button_areas | clickfinger
# scroll_method  = "two_finger"   # none | two_finger | edge | on_button_down
# dwt            = true           # disable while typing

# [input.pointer]
# accel_profile  = "adaptive"     # none | flat | adaptive | custom
# accel_speed    = 0.0            # -1 to 1
# scroll_factor  = 1.0

# [input.keyboard]
# layout       = "us"
# options      = ""
# repeat_rate  = 25               # per second
# repeat_delay = 400              # milliseconds

# [[input.device]]
# name          = "Logitech*"     # glob; or sysname, vendor, product, output
# accel_profile = "flat"

# What a DRM start inherits and a DRM exit leaves lit. docs/handoff.md has the rules.
[handoff]
mode = "auto"            # auto | retain | off. --handoff beats it. Read at start only
transition = "crossfade" # crossfade | cut: how the inherited frame gives way to this one
duration_ms = 400        # the crossfade
hold_limit_ms = 3000     # the longest the inherited frame stays before the transition starts

# The inspector: a Dear ImGui overlay over one output. Super+F12 toggles it.
[inspector]
enabled    = true            # false never builds it
open       = false           # open at start
output     = "focused"       # an output name, or focused (the output under the pointer)
panels     = ["outputs"]     # outputs | windows | clients | scene | memory
font_size  = 15
refresh_hz = 10              # the live panels' rate

# Screen reader support. docs/accessibility.md has the rules.
[accessibility]
enabled = "auto"         # auto | on | off. auto is on under DRM, off nested or headless

# Keyboard aids for physical keys. Every aid is off by default.
# [accessibility.keyboard]
# sticky = false           # a modifier tapped alone stays down for the next key, a second tap locks it
# sticky-shortcut = false  # five taps of Shift turn sticky keys on and off
# slow-ms = 0              # a key counts only after it stays down this long
# bounce-ms = 0            # a new press of a key this soon after its release is ignored
# mouse-keys = false       # the keypad moves the pointer, 5 clicks, / * - choose the button
# mouse-keys-speed = 1000  # the highest pointer speed in logical pixels per second
