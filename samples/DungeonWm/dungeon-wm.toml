# DungeonWm: a compositor that hangs windows on the walls of a 3D dungeon.
# Every key below is at its default. SIGHUP rereads this file. A key that
# needs a restart is named on the RELOAD line.

[render]
# vulkan or gl. Vulkan falls back to gl when it cannot start.
renderer = "vulkan"
# How many doorways deep the visibility walk goes.
room_depth = 4
# The most lights that light one level of the view.
max_lights = 8
# Anisotropic filtering for windows seen at an angle.
anisotropy = 8
# The texel-to-pixel ratio at or below which a window is sampled straight from the
# client buffer, without a mip copy. The old direct_sample_range = [MIN, MAX] key is
# still read for its MAX.
direct_sample_max = 1.2

[camera]
# Vertical field of view in degrees, spanning every output.
fov = 70
near = 0.05
far = 120
# Radians per pixel of mouse motion in crosshair mode and of Super+drag.
look_sensitivity = 0.0035
# Meters per second, and with Shift held.
walk_speed = 3.2
run_speed = 6.0
eye_height = 1.6
# The output that holds the crosshair. Empty uses the first output.
crosshair_output = ""
# Meters from the eye within which E and a click act on a window.
reach = 4.0

[reticle]
# The fill of the crosshair reticle. A dark outline goes around it.
color = "#ffffffe6"
# The side of the reticle in logical pixels.
size = 24

[world]
seed = 7
# Meters per KayKit unit. A wall module is four units.
unit = 0.75
# Room size in wall modules, width and depth.
room_min = [3, 3]
room_max = [6, 5]
# Share of room walls that are decorated and hold no window.
decor_walls = 0.2
# stone, wood, mixed or none.
roof = "stone"
# Beams under a wooden roof.
roof_beams = true
# Wall modules between torches.
torch_spacing = 2
# Meters from the floor to a torch.
torch_height = 2.1
torch_color = "#ff9e4d"
# Torch flicker as a share of the light, 0 to 1. 0 holds the light still.
torch_flicker = 0.12
# Density of decor in room corners, 0 to 1.
props = 0.5
# Barrels, boxes, chairs and stools are bodies you can knock over.
dynamic_props = true
# A 1280-pixel window at 1000 is 1.28 meters wide.
pixels_per_meter = 1000
# The color where no geometry is drawn.
sky_color = "#08080d"
# Rooms at startup, one per workspace.
rooms = 4

[windows]
# Slab thickness in meters.
depth = 0.02
# Meters from the floor to the center of a window with its frame and plaque.
hang_height = 1.6
edge_color = "#524538ff"
focus_color = "#f2b852ff"
# Opacity of windows without focus.
unfocused_opacity = 1.0
# Milliseconds a new window takes to drop onto its hook, swing and settle. 0 hangs it at once.
open_ms = 600
# Milliseconds a closed window takes to fade once it lands. 0 removes it at once.
close_ms = 600

[takeover]
# A window that keeps another size than the output during a takeover: off places it
# at the output's corner, fit scales it to fit, integer by whole steps, fill to cover
# and crop, stretch to the output's shape.
scaler = "off"
# How a scaled window is sampled: linear, nearest, or pixel for sharp pixel edges.
filter = "linear"
# Frames a second the window draws at most during a takeover. 0 is no limit.
frame_limit = 0

[frames]
# Hang every window in a picture frame with a plaque under it.
enabled = true
# Rail width in meters.
width = 0.06
# Meters from the wall to the front of the frame.
depth = 0.04
# Meters the canvas sits back inside the frame.
recess = 0.015
# Each room takes one of these, seeded from the world seed: oak, gilt, iron or stone.
styles = ["oak", "gilt", "iron", "stone"]
# A brass plaque with the title and Close, Takeover, Rehang and Throw.
plaque = true
# Plaque height in meters.
plaque_height = 0.07

[physics]
gravity = 9.81
# Meters a window must be pulled off its wall before it becomes a body.
pull_distance = 0.15
# Meters from a wall where a window at rest hangs again.
rehang_distance = 0.6
throw_scale = 1.0
# Meters per second below which a release is a drop, not a throw.
throw_min_speed = 0.6
# Kilograms per cubic meter of a prop.
prop_density = 60

[audio]
# Where a window's sound comes from: auto, hrtf, pan or off.
# auto selects hrtf for headphones and pan for any other sink.
mode = "auto"
# The SOFA file for hrtf mode.
hrtf = "/usr/share/libmysofa/default.sofa"
# Meters inside which a window plays at full gain.
reference_distance = 1.0
# How fast the gain falls with distance. 1.0 is the inverse distance law.
rolloff = 1.0
# Meters past which a window is silent.
max_distance = 40.0
# Extra decibels of loss for a source behind you in pan mode.
rear_loss_db = 3.0
# The low-pass cutoff in hertz for sound that comes through a doorway.
doorway_cutoff_hz = 2500.0
# Decibels of loss for each doorway after the first.
doorway_loss_db = 4.0
# Octaves the cutoff falls for each doorway after the first.
doorway_octaves = 1.0
# The level of the room reverb, 0 to 1.
reverb = 0.3
# The smallest direct level the reverb level is scaled by.
reverb_floor = 0.05
# The longest reverb time in seconds.
reverb_max_s = 2.0
# The most windows that play spatialized at once.
max_voices = 8
# The most HRTF updates per second for each window.
update_hz = 30

[sounds]
# Footsteps, jumps, landings, window impacts, hooks and plaque buttons.
# BASIN_MUTE=1 silences them whatever this says.
enabled = true
# The level of every effect, 0 to 1.
volume = 0.8

[avatar]
# A GLB with a skin. Empty uses the built-in Rogue_Hooded.
model = ""
scale = 0.75
# Rigid meshes that are drawn. Every other one is hidden.
show = ["Rogue_Cape"]
# Keyframes per second after resampling.
sample_hz = 30

[avatar.clips]
idle = "Idle"
walk = "Walking_A"
run = "Running_A"
jump-start = "Jump_Start"
airborne = "Jump_Idle"
land = "Jump_Land"
pick-up = "PickUp"
throw = "Throw"
interact = "Interact"

[xwayland]
# A second Xwayland at scale 1 and 96 DPI, stretched to the output, for [[launch]] rules
# with x11 = "low-density". It starts on its first client. Needs a restart.
low_density = true

# Launch rules choose the X server an X11 application starts on, before it starts.
# desktop_id is the desktop entry id and exec the base name of the program, after env
# and NAME=value words. A rule with both keys beats desktop_id, and desktop_id beats exec.
# [[launch]]
# exec = "leafpad"
# x11 = "low-density"

[inspector]
# The Dear ImGui inspector, a 2D overlay over the world that frees the cursor while it is open.
enabled = true
open = false
# An output name, or crosshair for the crosshair output.
output = "crosshair"
# Open at start: outputs | windows | clients | scene | memory | physics | camera | rooms | audio | pose
panels = ["camera", "physics"]
font_size = 15
# How often the live panels redraw.
refresh_hz = 10

[keybindings]
# A table says when a chord applies: "Super+Tab" = { action = "next-room", when = "windowed" }
# (always | windowed | fullscreen; a takeover counts as fullscreen).
"Super+Escape" = "leave-takeover"
"Super+Tab" = "next-room"
"Super+F" = "takeover"
"Super+Q" = "close"
# inspector opens and closes the inspector overlay.
"Super+F12" = "inspector"
# spawn runs the rest of the line through sh -c.
"Super+Return" = "spawn fuzzel"
# use gives the window under the crosshair focus and frees the cursor.
"E" = "use"
# release clears the focus and locks the pointer at the crosshair again.
"Super+E" = "release"
# While you hold a window, hold R and move the mouse to turn it, or scroll to roll it.
"R" = "rotate"
# While you hold a window, stand it upright at the nearest quarter turn.
"Shift+R" = "square"

# What a DRM start inherits and a DRM exit leaves lit. docs/handoff.md has the rules.
[handoff]
mode = "auto"            # auto | retain | off. --handoff beats it. Read at start only
transition = "crossfade" # crossfade | cut: how the inherited frame gives way to this one
duration_ms = 400        # the crossfade
hold_limit_ms = 3000     # the longest the inherited frame stays before the transition starts
