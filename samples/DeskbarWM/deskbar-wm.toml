[deskbar]
orientation = "vertical"  # "vertical" | "horizontal"
side = "right"            # "left" | "right"
end = "top"               # "top" | "bottom"
state = "expando"         # "mini" | "expando" | "full"
width = 0                 # 0 is automatic
icon-size = 32            # 16 to 96
show-labels = true
expand-windows = false    # window lists under each team
expand-new-teams = false
sort-teams = false
always-on-top = false
auto-raise = false
auto-hide = false

[deskbar.tray]
applets = ["workspaces", "clock"]

[deskbar.clock]
show-seconds = false
show-day-of-week = false
show-time-zone = false

[deskbar.menu]
recent-documents = 10
recent-folders = 10
recent-applications = 10
categories = true         # group applications by category

[icons]
haiku-directory = ""      # a directory of .hvif files

[look]
flavor = "haiku"          # "haiku" | "r5"
tab-color = "#ffcb00"
font-size = 12
blur = 0                  # 0 off

[focus]
mode = "click"            # "click" | "follow-mouse" | "follow-mouse-warping"
raise-on-focus = true

[stack-and-tile]
enabled = true
snap-distance = 10

[workspaces]
rows = 2
columns = 2

[desktop]
wallpaper = ""
color = "#336698"
scale = "fill"            # "fill" | "fit" | "center" | "tile"

# Key bindings, Mod+Mod+Key to an action or a command.
# Actions: close, zoom, minimize, terminal, previous-workspace, workspace N.
# [bindings]
# "Ctrl+Alt+q" = "close"
# "Ctrl+Alt+Return" = "foot"
# "Alt+F1" = "workspace 1"

