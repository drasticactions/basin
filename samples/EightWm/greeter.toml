# eight-wm --greeter configuration. The greeter reads /etc/eight-wm/greeter.toml,
# or the file --config names. It never reads ~/.config/eight-wm and never writes
# this file. SIGHUP rereads it. Every key below shows its default.

[look]
# dark | light: the variant the sign-in screen's controls take.
theme = "dark"
# The accent color, as #rrggbb. It fills the curtain when there is no picture,
# the user tile and the buttons.
accent = "#2d89ef"
# The lock picture, an image path scaled to cover each output, or "" for the accent.
picture = ""
# 12 | 24
clock = "12"

[users]
# false shows no user tiles and asks for a user name.
list = true
# User names that are never listed.
hide = []
# 0 reads UID_MIN and UID_MAX from /etc/login.defs.
min_uid = 0
max_uid = 0

[sessions]
# The session id for a user with no last session. "" picks the first Wayland entry.
default = ""
# The command that starts an X11 session. [] hides xsessions.
x11_wrapper = ["startx"]
# gtkgreet's file: one command for each line.
environments = "/etc/greetd/environments"
# true runs the command text the greeter is given through greeter/command as the session.
allow_command = false

[keyboard]
# xkb layouts Sign-in options offers, as "us" or "de(neo)". One or none shows no list.
layouts = []
# When the on-screen keyboard rises: auto (on a touch in a field) | always | never
on_screen = "auto"
# xs | s | m | l
on_screen_size = "m"

[power]
# false removes the power button.
enabled = true

[status]
battery = true
network = true

[network]
# false makes the Wi-Fi flyout read-only.
join = true

[accessibility]
high_contrast = false
# 1.0, 1.25, 1.5 or 2.0
text_scale = 1.0
# off | toggle | on
screen_reader = "toggle"
orca = ["orca", "--replace"]

# Keyboard aids for physical keys at login. Every aid is off by default.
# [accessibility.keyboard]
# sticky = false           # a modifier tapped alone stays down for the next key, a second tap locks it
# sticky_shortcut = false  # five taps of Shift turn sticky keys on and off
# slow_ms = 0              # a key counts only after it stays down this long
# bounce_ms = 0            # a new press of a key this soon after its release is ignored
# mouse_keys = false       # the keypad moves the pointer, 5 clicks, / * - choose the button
# mouse_keys_speed = 1000  # the highest pointer speed in logical pixels per second

[render]
# A renderer name, or "" for the fallback chain vulkan, gl, pixman.
renderer = ""

[handoff]
# auto leaves the sign-in view lit for the session under greetd.
# auto | retain | off. --handoff beats it. Read at start only.
mode = "auto"
# crossfade | cut: how the inherited frame gives way to the greeter.
transition = "crossfade"
duration_ms = 400
# The longest the inherited frame stays before the transition starts.
hold_limit_ms = 3000
